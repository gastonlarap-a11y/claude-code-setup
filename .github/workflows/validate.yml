name: validate

on:
  push:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: JSON well-formedness
        run: |
          shopt -s nullglob
          jq empty .claude-plugin/marketplace.json global/settings.json global/mcp-servers.json
          for f in plugins/*/.claude-plugin/plugin.json plugins/*/.mcp.json plugins/*/.lsp.json; do
            jq empty "$f" || { echo "invalid JSON: $f"; exit 1; }
          done

      - name: Version parity (dual-bump rule)
        run: bash scripts/check-versions.sh

      - name: shellcheck
        run: shellcheck install.sh scripts/*.sh global/hooks/*.sh global/statusline.sh

      - name: Language anchors (single source consumed by installers + CI)
        run: bash scripts/check-language-anchors.sh

      # Static lint ONLY — runtime coverage for install.ps1 under real Windows
      # PowerShell 5.1 lives in installer-smoke.yml (smoke-windows-ps51 job).
      # Write-Host is intentional installer output, hence the excluded rule.
      - name: PSScriptAnalyzer (install.ps1 + smoke script)
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          }
          # -Path takes a single string; loop the scripts and collect findings.
          $findings = @()
          foreach ($script in './install.ps1', './scripts/installer-smoke.ps1') {
            $findings += Invoke-ScriptAnalyzer -Path $script `
              -Severity Warning, Error -ExcludeRule PSAvoidUsingWriteHost
          }
          if ($findings) {
            $findings | Format-Table -AutoSize | Out-String | Write-Host
            exit 1
          }

      # claude plugin validate is an offline schema check (official CI recommendation).
      # If this step ever starts requiring auth, drop it and rely on the steps above.
      - name: Plugin schema validation
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          export PATH="$HOME/.local/bin:$PATH"
          claude --version
          for p in plugins/*/; do
            claude plugin validate "$p" --strict
          done
