name: validate

on:
  push:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Full history so the version-bump gate can diff feature branches against main.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: JSON well-formedness
        run: |
          shopt -s nullglob
          jq empty .claude-plugin/marketplace.json global/settings.json global/mcp-servers.json
          for f in plugins/*/.claude-plugin/plugin.json plugins/*/.mcp.json plugins/*/.lsp.json; do
            jq empty "$f" || { echo "invalid JSON: $f"; exit 1; }
          done

      - name: Version parity (dual-bump rule)
        run: bash scripts/check-versions.sh

      # Feature branches only: a plugin change without its version bump fails before the
      # PR merges; on main the diff is empty by definition.
      - name: Plugin version bumped when plugin changed
        if: github.ref != 'refs/heads/main'
        run: bash scripts/check-plugin-version-bump.sh origin/main

      - name: shellcheck
        run: shellcheck install.sh scripts/*.sh global/hooks/*.sh global/statusline.sh

      - name: Language anchors (single source consumed by installers + CI)
        run: bash scripts/check-language-anchors.sh

      - name: Subagent model consistency (frontmatter vs CLAUDE_CODE_SUBAGENT_MODEL)
        run: bash scripts/check-subagent-model.sh

      - name: Template skeletons are valid config (setup-project references)
        run: bash scripts/check-templates.sh

      # v3 (v2 is deprecated: Node 20 leaves GitHub runners Sept 2026). On push events it
      # scans only the pushed commit range — the fetch-depth: 0 checkout above lets that
      # range resolve. GITLEAKS_LICENSE is only needed for organization accounts.
      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Static lint ONLY — runtime coverage for install.ps1 under real Windows
      # PowerShell 5.1 lives in installer-smoke.yml (smoke-windows-ps51 job).
      # Write-Host is intentional installer output, hence the excluded rule.
      - name: PSScriptAnalyzer (installers, hook ports, statusline)
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          }
          # -Path takes a single string; loop the scripts and collect findings.
          $targets = @('./install.ps1', './scripts/installer-smoke.ps1', './global/statusline.ps1') +
            @(Get-ChildItem './global/hooks/*.ps1' | ForEach-Object { $_.FullName })
          $findings = @()
          foreach ($script in $targets) {
            $findings += Invoke-ScriptAnalyzer -Path $script `
              -Severity Warning, Error -ExcludeRule PSAvoidUsingWriteHost
          }
          if ($findings) {
            $findings | Format-Table -AutoSize | Out-String | Write-Host
            exit 1
          }

      # claude plugin validate is an offline schema check (official CI recommendation).
      # If this step ever starts requiring auth, drop it and rely on the steps above.
      - name: Plugin schema validation
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          export PATH="$HOME/.local/bin:$PATH"
          claude --version
          for p in plugins/*/; do
            claude plugin validate "$p" --strict
          done
